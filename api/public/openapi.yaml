openapi: 3.0.3
info:
  title: Jira-like API
  version: 1.0.0
  description: Session-authenticated, workspace-based issue tracking API.
servers:
  - url: http://localhost:3000
    description: Local development
tags:
  - name: Authentication
  - name: Workspaces
  - name: Epics
  - name: Issues
  - name: Sprints
  - name: Comments
paths:
  /api/v1/auth/register:
    post:
      tags: [Authentication]
      summary: Register a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistration'
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Log in and create a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200':
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/me:
    get:
      tags: [Authentication]
      summary: Get the current user
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/logout:
    delete:
      tags: [Authentication]
      summary: Log out and clear the session
      security: [{ cookieAuth: [] }]
      responses:
        '204':
          description: Session cleared
  /api/v1/workspaces:
    get:
      tags: [Workspaces]
      summary: List the current user's workspaces
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Workspace list
          content:
            application/json:
              schema:
                type: object
                required: [workspaces]
                properties:
                  workspaces:
                    type: array
                    items: { $ref: '#/components/schemas/Workspace' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Workspaces]
      summary: Create a workspace
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspace]
              properties:
                workspace: { $ref: '#/components/schemas/WorkspaceInput' }
      responses:
        '201':
          description: Workspace created
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspace: { $ref: '#/components/schemas/Workspace' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/workspaces/{workspace_id}/epics:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Epics]
      summary: List workspace epics
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Epic list
          content:
            application/json:
              schema:
                type: object
                properties:
                  epics:
                    type: array
                    items: { $ref: '#/components/schemas/Epic' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Epics]
      summary: Create an epic
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [epic]
              properties:
                epic: { $ref: '#/components/schemas/EpicInput' }
      responses:
        '201':
          description: Epic created
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/workspaces/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Workspaces]
      summary: Get a workspace
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Workspace details }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Workspaces]
      summary: Update a workspace
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspace]
              properties:
                workspace: { $ref: '#/components/schemas/WorkspaceInput' }
      responses:
        '200': { description: Workspace updated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Workspaces]
      summary: Delete a workspace
      security: [{ cookieAuth: [] }]
      responses:
        '204': { description: Workspace deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/workspaces/{workspace_id}/issues:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Issues]
      summary: List and filter workspace issues
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Status' }
        - { $ref: '#/components/parameters/IssueType' }
        - { $ref: '#/components/parameters/AssigneeId' }
        - { $ref: '#/components/parameters/EpicId' }
      responses:
        '200':
          description: Issue list
          content:
            application/json:
              schema:
                type: object
                properties:
                  issues:
                    type: array
                    items: { $ref: '#/components/schemas/Issue' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Issues]
      summary: Create an issue
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issue]
              properties:
                issue: { $ref: '#/components/schemas/IssueInput' }
      responses:
        '201': { description: Issue created }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/workspaces/{workspace_id}/sprints:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Sprints]
      summary: List workspace sprints
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Sprint list }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Sprints]
      summary: Create a sprint
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sprint]
              properties:
                sprint: { $ref: '#/components/schemas/SprintInput' }
      responses:
        '201': { description: Sprint created }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/issues/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Issues]
      summary: Get an issue
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Issue details }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Issues]
      summary: Update an issue
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                issue: { $ref: '#/components/schemas/IssueInput' }
      responses:
        '200': { description: Issue updated }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Issues]
      summary: Delete an issue
      security: [{ cookieAuth: [] }]
      responses:
        '204': { description: Issue deleted }
  /api/v1/epics/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Epics]
      summary: Get an epic
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Epic details }
    patch:
      tags: [Epics]
      summary: Update an epic
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                epic: { $ref: '#/components/schemas/EpicInput' }
      responses:
        '200': { description: Epic updated }
    delete:
      tags: [Epics]
      summary: Delete an epic
      security: [{ cookieAuth: [] }]
      responses:
        '204': { description: Epic deleted }
  /api/v1/sprints/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Sprints]
      summary: Get a sprint
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Sprint details }
    patch:
      tags: [Sprints]
      summary: Update a sprint
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Sprint updated }
    delete:
      tags: [Sprints]
      summary: Delete a sprint
      security: [{ cookieAuth: [] }]
      responses:
        '204': { description: Sprint deleted }
  /api/v1/issues/{issue_id}/comments:
    parameters:
      - $ref: '#/components/parameters/IssueId'
    get:
      tags: [Comments]
      summary: List issue comments
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Comment list }
    post:
      tags: [Comments]
      summary: Create an issue comment
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                comment: { $ref: '#/components/schemas/CommentInput' }
      responses:
        '201': { description: Comment created }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/comments/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Comments]
      summary: Update a comment
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: { $ref: '#/components/schemas/CommentInput' }
      responses:
        '200': { description: Comment updated }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Comments]
      summary: Delete a comment
      security: [{ cookieAuth: [] }]
      responses:
        '204': { description: Comment deleted }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: _api_session
      description: Rails session cookie created by the login endpoint.
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: integer } }
    WorkspaceId: { name: workspace_id, in: path, required: true, schema: { type: integer } }
    IssueId: { name: issue_id, in: path, required: true, schema: { type: integer } }
    Status:
      name: status
      in: query
      schema: { type: string, enum: [to_do, in_progress, review, qa, done] }
    IssueType:
      name: issue_type
      in: query
      schema: { type: string, enum: [task, bug, story, feature] }
    AssigneeId: { name: assignee_id, in: query, schema: { type: integer } }
    EpicId: { name: epic_id, in: query, schema: { type: integer } }
  schemas:
    Login:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: seed-user-1@example.com }
        password: { type: string, format: password, example: Password123! }
    UserRegistration:
      type: object
      required: [user]
      properties:
        user:
          type: object
          required: [name, email, password, password_confirmation]
          properties:
            name: { type: string }
            email: { type: string, format: email }
            password: { type: string, format: password }
            password_confirmation: { type: string, format: password }
    UserResponse:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
    WorkspaceInput:
      type: object
      required: [name, key]
      properties:
        name: { type: string }
        key: { type: string }
    Workspace:
      allOf:
        - $ref: '#/components/schemas/WorkspaceInput'
        - type: object
          properties:
            id: { type: integer }
    EpicInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
    Epic:
      allOf:
        - $ref: '#/components/schemas/EpicInput'
        - type: object
          properties:
            id: { type: integer }
            workspace_id: { type: integer }
    IssueInput:
      type: object
      required: [title]
      properties:
        title: { type: string }
        description: { type: string, nullable: true }
        status: { type: string, enum: [to_do, in_progress, review, qa, done] }
        issue_type: { type: string, enum: [task, bug, story, feature] }
        epic_id: { type: integer, nullable: true }
        assignee_id: { type: integer, nullable: true }
        sprint_id: { type: integer, nullable: true }
    Issue:
      allOf:
        - $ref: '#/components/schemas/IssueInput'
        - type: object
          properties:
            id: { type: integer }
            workspace_id: { type: integer }
            creator_id: { type: integer }
    SprintInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        status: { type: string, enum: [planned, active, completed] }
    CommentInput:
      type: object
      required: [body]
      properties:
        body: { type: string }
    Error:
      type: object
      properties:
        error: { type: string }
        errors:
          type: array
          items: { type: string }
  responses:
    Unauthorized:
      description: Authentication required or credentials invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated user is not a workspace member
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
